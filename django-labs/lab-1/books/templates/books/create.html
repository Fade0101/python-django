{% extends 'books/base.html' %} {% block content %}

<h1>➕ Add Book</h1>

<form method="post">
  {% csrf_token %}

  <label>Title</label>
  <input type="text" name="title" />

  <label>Author</label>
  <input type="text" name="author" />

  <label>Price</label>
  <input type="number" name="price" />

  <button type="submit">Save</button>
</form>

{% endblock %}
